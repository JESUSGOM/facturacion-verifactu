spring.application.name=facturacion

# ============================================================
# SERVIDOR
# ============================================================

server.port=8081


# ============================================================
# BASE DE DATOS
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info


# ============================================================
# ERRORES WEB
# ============================================================

spring.web.error.include-stacktrace=never
spring.web.error.include-message=always


# ============================================================
# HIKARI - MySQL remoto
# ============================================================

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=0


# ============================================================
# IDENTIFICACION DEL SISTEMA INFORMATICO VERI*FACTU
# ============================================================
#
# Los datos se proporcionan mediante variables de entorno.
#
# El numero de instalacion NO es global:
# se genera y almacena por empresa.
#
# IndicadorMultiplesOT tampoco se configura aqui:
# se calcula automaticamente por la aplicacion.
# ============================================================

verifactu.sistema.nombre-razon=${VERIFACTU_SISTEMA_NOMBRE_RAZON:}
verifactu.sistema.nif=${VERIFACTU_SISTEMA_NIF:}

verifactu.sistema.nombre-sistema=${VERIFACTU_SISTEMA_NOMBRE:}
verifactu.sistema.id-sistema=${VERIFACTU_SISTEMA_ID:}
verifactu.sistema.version=${VERIFACTU_SISTEMA_VERSION:}

verifactu.sistema.solo-verifactu=${VERIFACTU_SISTEMA_SOLO_VERIFACTU:}
verifactu.sistema.multi-ot=${VERIFACTU_SISTEMA_MULTI_OT:}

# ============================================================
# AEAT - CERTIFICADO CLIENTE
# ============================================================
#
# Se utiliza el almacen personal de certificados de Windows
# (Windows-MY).
#
# La huella SHA-256 identifica de forma inequivoca el
# certificado que debe utilizar Gombeth Factura.
#
# NO se almacena aqui ninguna clave privada ni contrasena.
# ============================================================

verifactu.aeat.certificado.sha256=${VERIFACTU_AEAT_CERT_SHA256:}

# ============================================================
# ENVIO VERI*FACTU - DESARROLLO
# ============================================================
#
# En DEV el proveedor es simulado, por lo que permitimos
# ejercitar el flujo de envio sin contactar con AEAT.
# ============================================================

verifactu.envio-habilitado=${VERIFACTU_ENVIO_HABILITADO:false}

# Consulta / reconciliacion AEAT bloqueada por defecto
verifactu.consulta-habilitada=${VERIFACTU_CONSULTA_HABILITADA:false}

# Entorno de la URL del QR tributario VERI*FACTU
# Valor seguro por defecto: PRUEBAS
verifactu.qr.entorno=${VERIFACTU_QR_ENTORNO:PRUEBAS}
